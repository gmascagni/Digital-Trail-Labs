<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var saved = localStorage.getItem('color-scheme');
        document.querySelector('meta[name="color-scheme"]').content =
          saved === 'light' || saved === 'dark' ? saved : 'dark';
      } catch (e) {}
    </script>
    <title>Digital Trail Labs — Enterprise IT Leadership &amp; Applied AI Studio</title>
    <meta
      name="description"
      content="Digital Trail Labs is the software and applied AI studio founded by Georgio Mascagni, pairing 25+ years of enterprise IT leadership with 14+ shipped web, mobile, and autonomous AI applications."
    />
    <link rel="canonical" href="https://digitaltraillabs.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digital Trail Labs" />
    <meta
      property="og:title"
      content="Digital Trail Labs — Enterprise IT Leadership &amp; Applied AI Studio"
    />
    <meta
      property="og:description"
      content="14+ shipped applications across Air-Gapped AI, Multi-Agent Telegram Orchestration, Native Android, Geospatial Systems, and Consumer Web."
    />
    <meta property="og:url" content="https://digitaltraillabs.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
