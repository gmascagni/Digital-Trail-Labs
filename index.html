<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var saved = localStorage.getItem('color-scheme');
        document.querySelector('meta[name="color-scheme"]').content =
          saved === 'light' || saved === 'dark' ? saved : 'dark';
      } catch (e) {}
    </script>
    <title>Digital Trail Labs — Avant-Garde Product &amp; AI Telemetry Studio</title>
    <meta
      name="description"
      content="Digital Trail Labs (DTL // v2.6) — An avant-garde digital product and applied AI studio by Georgio Mascagni crafting tactile consumer apps (The Brew App, Loose-Leaf) and autonomous AI systems."
    />
    <link rel="canonical" href="https://digitaltraillabs.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digital Trail Labs" />
    <meta
      property="og:title"
      content="Digital Trail Labs — Avant-Garde Product &amp; AI Telemetry Studio"
    />
    <meta
      property="og:description"
      content="Tactile consumer software (The Brew App, Loose-Leaf), WebGL telemetry, air-gapped RAG appliances, and autonomous multi-agent swarms."
    />
    <meta property="og:url" content="https://digitaltraillabs.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
